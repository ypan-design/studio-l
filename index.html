<html lang="en">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#18212A;--muted:#6f7a80;--sand:#EFE9DF;--teal:#2C8C8E;--terra:#C4693F;
    --glass:rgba(255,255,255,.52);--glass-hi:rgba(255,255,255,.78);--edge:rgba(255,255,255,.75)}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--sand);color:var(--ink);
    font:15px/1.45 Archivo,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .field{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;will-change:transform}
  .b1{width:52vmax;height:52vmax;background:var(--teal);left:-14vmax;top:-18vmax;animation:d1 26s ease-in-out infinite alternate}
  .b2{width:44vmax;height:44vmax;background:var(--terra);right:-14vmax;bottom:-16vmax;animation:d2 30s ease-in-out infinite alternate}
  .b3{width:26vmax;height:26vmax;background:#fff;left:40%;top:30%;opacity:.7;animation:d3 22s ease-in-out infinite alternate}
  @keyframes d1{to{transform:translate(12vmax,10vmax) scale(1.08)}}
  @keyframes d2{to{transform:translate(-10vmax,-12vmax) scale(1.1)}}
  @keyframes d3{to{transform:translate(-14vmax,8vmax) scale(.9)}}
  @media (prefers-reduced-motion:reduce){.blob{animation:none}}
  #gate{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
  .glass{background:linear-gradient(160deg,var(--glass-hi),var(--glass));backdrop-filter:blur(22px) saturate(170%);
    -webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--edge);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 24px 60px -24px rgba(24,33,42,.35)}
  .card{width:100%;max-width:340px;border-radius:22px;padding:30px 26px 22px;text-align:center}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin:2px 0 26px;color:var(--ink)}
  .brand .wm{width:118px;height:auto;display:block}
  .mark{font:500 10px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.5em;text-indent:.5em;color:var(--ink);opacity:.55}
  .mark i{font-style:normal;color:var(--terra)}
  .btn{width:100%;height:46px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.6);
    font:500 14.5px Archivo,sans-serif;color:var(--ink);cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:center;
    transition:background .2s,transform .1s}
  .btn:hover{background:rgba(255,255,255,.85)}.btn:active{transform:scale(.99)}
  .btn.go{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.go:hover{background:#26323d}
  .btn:disabled{opacity:.5;cursor:default}
  .or{display:flex;align-items:center;gap:12px;margin:18px 0;font:400 10px "IBM Plex Mono",monospace;letter-spacing:.3em;color:var(--muted)}
  .or:before,.or:after{content:"";flex:1;height:1px;background:rgba(24,33,42,.12)}
  input.in{width:100%;height:46px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.5);
    padding:0 14px;font:15px Archivo,sans-serif;color:var(--ink);outline:none;margin-bottom:10px;transition:border-color .2s,background .2s}
  input.in:focus{border-color:var(--teal);background:rgba(255,255,255,.8)}
  .code{display:flex;gap:7px;justify-content:center;margin:4px 0 12px}
  .code input{width:40px;height:50px;border-radius:12px;border:1px solid var(--edge);background:rgba(255,255,255,.55);
    text-align:center;font:500 20px "IBM Plex Mono",monospace;color:var(--ink);outline:none}
  .code input:focus{border-color:var(--teal);background:rgba(255,255,255,.85)}
  .hint{font-size:13px;color:var(--muted);margin:0 0 14px}
  .msg{margin-top:14px;font-size:12.5px;color:var(--muted);min-height:1.3em}.msg.err{color:var(--terra)}
  .link{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .row{display:flex;justify-content:space-between;margin-top:12px}
  [hidden]{display:none!important}
</style>
</head>
<body>

><path d="M238.9 122.9C233.8 117.3 231.2 110.6 231.2 102.5C231.2 94.5 233.8 87.7 238.9 82.1C244.0 76.6 250.4 73.8 258.3 73.8C265.5 73.8 271.4 76.0 276.1 80.5L276.1 75.4L294.9 75.4L294.9 129.6L276.3 129.6L276.3 123.5L276.1 123.5C271.4 128.6 265.5 131.2 258.3 131.2C250.4 131.2 244.0 128.4 238.9 122.9Z M254.8 93.3C252.4 95.7 251.2 98.8 251.2 102.5C251.2 106.3 252.3 109.3 254.7 111.7C257.0 114.0 260.1 115.2 263.9 115.2C267.6 115.2 270.6 114.0 273.0 111.6C275.3 109.2 276.5 106.2 276.5 102.5C276.5 98.8 275.3 95.7 272.8 93.3C270.4 90.9 267.4 89.7 263.9 89.7C260.3 89.7 257.3 90.9 254.8 93.3Z"/><path d="M301.7 129.6L301.7 75.4L320.5 75.4L320.5 83.2L320.7 83.2C320.9 82.9 321.1 82.5 321.4 82.1C321.7 81.7 322.4 81.0 323.5 79.9C324.5 78.8 325.7 77.9 326.9 77.0C328.1 76.2 329.6 75.4 331.5 74.8C333.4 74.1 335.4 73.8 337.4 73.8C339.4 73.8 341.4 74.1 343.4 74.6C345.4 75.2 346.8 75.7 347.8 76.3L349.3 77.1L341.4 93.0C339.1 91.0 335.8 90.1 331.6 90.1C329.4 90.1 327.4 90.5 325.8 91.5C324.2 92.5 323.0 93.7 322.4 95.1C321.7 96.5 321.2 97.7 320.9 98.7C320.7 99.7 320.5 100.5 320.5 101.0L320.5 129.6Z"/><path d="M377.7 89.1C374.1 89.1 371.1 90.4 368.5 93.0C366.0 95.6 364.7 98.8 364.7 102.4C364.7 106.2 366.0 109.3 368.5 112C371.1 114.6 374.1 115.9 377.7 115.9C379.4 115.9 381.0 115.6 382.5 115.2C384.0 114.8 385.1 114.4 385.8 114.0L386.8 113.3L393.1 126.3C392.6 126.7 392.0 127.1 391.1 127.6C390.2 128.2 388.2 128.9 385.0 129.8C381.9 130.7 378.5 131.2 374.9 131.2C366.9 131.2 359.9 128.4 353.9 122.8C347.8 117.2 344.8 110.5 344.8 102.6C344.8 94.7 347.8 88 353.9 82.3C359.9 76.6 366.9 73.8 374.9 73.8C378.5 73.8 381.8 74.2 384.9 75.0C387.9 75.9 390.1 76.7 391.3 77.6L393.1 78.8L386.8 91.6C384.4 89.9 381.4 89.1 377.7 89.1Z"/><path d="M394.9 129.6L394.9 38.7L413.7 38.7L413.7 81.1L413.9 81.1C418.8 76.2 424.0 73.8 429.5 73.8C432.2 73.8 434.9 74.1 437.5 74.8C440.2 75.5 442.7 76.6 445.2 78.1C447.6 79.6 449.6 81.7 451.1 84.4C452.6 87.1 453.4 90.3 453.4 93.9L453.4 129.6L434.6 129.6L434.6 98.9C434.6 96.1 433.7 9     <div id="s1">
      <button class="btn" id="g" type="button">
        <svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </button>
      <div class="or">OR</div>
      <form id="ef" novalidate>
        <input class="in" id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="name@ydsarch.com" aria-label="Email">
        <button class="btn go" id="send" type="submit">Email me a code</button>
      </form>
    </div>
    <div id="s2" hidden>
      <p class="hint" id="sent">Check your inbox.</p>
      <div class="code" id="code"></div>
      <button class="btn go" id="verify" type="button">Sign in</button>
      <div class="row"><button class="link" id="back" type="button">Different email</button><button class="link" id="again" type="button">Resend</button></div>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
        integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script>
(function () {
  var SB_URL = 'https://wuqalbzcoadmerfyoufn.supabase.co';
  var KEY = 'sb_publishable_nzoPPaTQ-lsFtolMA4Q2-A_1_5JbXBW';
  function $(id) { return document.getElementById(id); }
  var msg = $('msg');
  function say(t, bad) { msg.textContent = t || ''; msg.className = 'msg' + (bad ? ' err' : ''); }
  function yds(e) { return /^[a-z0-9._%+'-]+@ydsarch\.com$/i.test(e || ''); }
  if (!window.supabase) { say('Could not load. Check your connection and refresh.', true); return; }
  var sb = window.supabase.createClient(SB_URL, KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  window.__loft = { sb: sb };

  // ---- Google ----
  $('g').onclick = function () {
    say('Opening Google…');
    sb.auth.signInWithOAuth({ provider: 'google',
      options: { redirectTo: location.origin + location.pathname, queryParams: { hd: 'ydsarch.com', prompt: 'select_account' } }
    }).then(function (r) { if (r.error) say(r.error.message, true); });
  };

  // ---- Email code ----
  var email = '', cooldown = 0, cdTimer;
  var boxes = [];
  (function buildCode() {
    var wrap = $('code');
    for (var i = 0; i < 6; i++) {
      var b = document.createElement('input');
      b.inputMode = 'numeric'; b.autocomplete = i === 0 ? 'one-time-code' : 'off'; b.maxLength = 6; b.setAttribute('aria-label', 'Digit ' + (i + 1));
      (function (idx, el) {
        el.addEventListener('input', function () {
          var v = el.value.replace(/\D/g, '');
          if (v.length > 1) { fill(v); return; }               // pasted or autofilled the whole code
          el.value = v; if (v && idx < 5) boxes[idx + 1].focus();
          if (codeValue().length === 6) verify();
        });
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Backspace' && !el.value && idx > 0) { boxes[idx - 1].focus(); boxes[idx - 1].value = ''; }
          if (e.key === 'Enter') verify();
        });
      })(i, b);
      boxes.push(b); wrap.appendChild(b);
    }
  })();
  function fill(v) { v = v.slice(0, 6); for (var i = 0; i < 6; i++) boxes[i].value = v[i] || ''; boxes[Math.min(v.length, 5)].focus(); if (v.length === 6) verify(); }
  function codeValue() { return boxes.map(function (b) { return b.value; }).join(''); }
  function tick() {
    var a = $('again'); if (cooldown > 0) { a.disabled = true; a.textContent = 'Resend in ' + cooldown + 's'; cooldown--; cdTimer = setTimeout(tick, 1000); }
    else { a.disabled = false; a.textContent = 'Resend'; }
  }
  async function sendCode() {
    var e = $('em').value.trim().toLowerCase();
    if (!yds(e)) { say('Use your @ydsarch.com email.', true); $('em').focus(); return; }
    var btn = $('send'); btn.disabled = true; say('Sending…');
    var r = await sb.auth.signInWithOtp({ email: e, options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname } });
    btn.disabled = false;
    if (r.error) { say(/rate|seconds/i.test(r.error.message) ? 'Please wait a minute, then try again.' : 'Could not send the code. Try Google instead.', true); return; }
    email = e; $('s1').hidden = true; $('s2').hidden = false; say('');
    $('sent').textContent = 'Check ' + e + '. Open the link on this device, or type the code here.';
    boxes.forEach(function (b) { b.value = ''; }); boxes[0].focus();
    clearTimeout(cdTimer); cooldown = 60; tick();
  }
  var verifying = false;
  async function verify() {
    var c = codeValue(); if (c.length !== 6 || verifying) return;
    verifying = true; $('verify').disabled = true; say('Checking…');
    var r = await sb.auth.verifyOtp({ email: email, token: c, type: 'email' });
    verifying = false; $('verify').disabled = false;
    if (r.error) { say('That code didn’t work. Check it or resend.', true); boxes.forEach(function (b) { b.value = ''; }); boxes[0].focus(); }
  }
  $('ef').onsubmit = function (e) { e.preventDefault(); sendCode(); };
  $('verify').onclick = verify;
  $('again').onclick = function () { $('em').value = email; sendCode(); };
  $('back').onclick = function () { $('s2').hidden = true; $('s1').hidden = false; say(''); clearTimeout(cdTimer); $('em').focus(); };

  // ---- Session → load the app (handed out only to confirmed YDS accounts by the database) ----
  var started = false, rejected = false;
  async function boot(session) {
    if (!session || started) return;
    if (!yds(session.user && session.user.email)) { rejected = true; await sb.auth.signOut(); say('That account is not part of YDS.', true); return; }
    started = true; say('Opening…');
    var r = await sb.rpc('get_app_bundle', { p_name: 'portal' });
    if (r.error || !r.data) { started = false; say('Access denied.', true); return; }
    var s = document.createElement('script');
    s.src = window.URL.createObjectURL(new Blob([r.data], { type: 'text/javascript' }));
    s.onload = function () { try { window.URL.revokeObjectURL(s.src); } catch (e) {} };
    document.body.appendChild(s);
  }
  sb.auth.onAuthStateChange(function (ev, session) {
    if (session && /[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname + location.hash);
    if (ev === 'SIGNED_OUT') { if (!rejected) location.reload(); return; }
    setTimeout(function () { boot(session); }, 0);   // never call Supabase inside this callback directly
  });
  sb.auth.getSession().then(function (r) { boot(r.data && r.data.session); });
  var q = new URLSearchParams(location.search);
  if (q.get('error_description')) { say('Only YDS accounts can sign in here.', true); history.replaceState(null, '', location.pathname); }
})();
</script>
</body>
