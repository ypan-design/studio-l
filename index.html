<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>.</title>
<style>
  :root { --ink:#1d1d1b; --muted:#8a8780; --line:#e7e4de; --paper:#fbfaf7; --accent:#E8743B; }
  html,body { margin:0; height:100%; background:var(--paper); color:var(--ink);
    font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  #gate { min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .card { width:100%; max-width:320px; text-align:center; }
  .mark { font-size:13px; letter-spacing:.35em; text-transform:lowercase; color:var(--muted); margin-bottom:28px; }
  .mark b { color:var(--accent); font-weight:600; }
  button.g { width:100%; padding:12px 16px; border:1px solid var(--line); background:#fff; border-radius:10px;
    font:inherit; cursor:pointer; display:flex; gap:10px; align-items:center; justify-content:center; }
  button.g:hover { border-color:#cfcac1; }
  .msg { margin-top:16px; font-size:13px; color:var(--muted); min-height:1.4em; }
  .err { color:#b4432a; }
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="mark">l<b>o</b>ft</div>
    <button class="g" id="signin" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
        integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
<script>
(function () {
  var SB_URL = 'https://wuqalbzcoadmerfyoufn.supabase.co';
  var KEY = 'sb_publishable_nzoPPaTQ-lsFtolMA4Q2-A_1_5JbXBW';
  var msg = document.getElementById('msg');
  function say(t, bad) { msg.textContent = t; msg.className = 'msg' + (bad ? ' err' : ''); }
  function yds(e) { return /^[a-z0-9._%+'-]+@ydsarch\.com$/i.test(e || ''); }

  if (!window.supabase) { say('Could not load. Check your connection and refresh.', true); return; }
  var sb = window.supabase.createClient(SB_URL, KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  window.__loft = { sb: sb };

  document.getElementById('signin').onclick = function () {
    say('Opening Google…');
    sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: location.origin + location.pathname, queryParams: { hd: 'ydsarch.com', prompt: 'select_account' } }
    }).then(function (r) { if (r.error) say(r.error.message, true); });
  };

  var started = false, rejected = false;
  async function boot(session) {
    if (!session || started) return;
    if (!yds(session.user && session.user.email)) {
      rejected = true;
      await sb.auth.signOut();
      say('That account is not part of YDS.', true);
      return;
    }
    started = true;
    say('Loading…');
    // The app itself is only handed out to signed-in YDS accounts (enforced by the database).
    var r = await sb.rpc('get_app_bundle', { p_name: 'portal' });
    if (r.error || !r.data) { started = false; say('Access denied.', true); return; }
    var blob = new Blob([r.data], { type: 'text/javascript' });
    var s = document.createElement('script');
    s.src = URL_create(blob);
    s.onload = function () { URL_revoke(s.src); };
    document.body.appendChild(s);
  }
  function URL_create(b) { return window.URL.createObjectURL(b); }
  function URL_revoke(u) { try { window.URL.revokeObjectURL(u); } catch (e) {} }

  // Clean ?code= out of the address bar after Google returns.
  sb.auth.onAuthStateChange(function (ev, session) {
    if (session && /[?&]code=/.test(location.search)) history.replaceState(null, '', location.pathname);
    if (ev === 'SIGNED_OUT') { if (!rejected) location.reload(); return; }
    setTimeout(function () { boot(session); }, 0);   // never call Supabase inside this callback directly
  });
  sb.auth.getSession().then(function (r) {
    if (r.error && /[?&]error/.test(location.search)) say('Sign-in was not completed.', true);
    boot(r.data && r.data.session);
  });
  var q = new URLSearchParams(location.search);
  if (q.get('error_description')) { say('Only YDS accounts can sign in here.', true); history.replaceState(null, '', location.pathname); }
})();
</script>
</body>
</html>
